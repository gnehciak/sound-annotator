<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The signal dot (src/components/HomeDot.tsx): the tangerine accent with
       its glow. Dark-theme accent by default; the light theme's deeper one
       when the browser chrome is light, as in src/index.css. -->
  <style>
    .dot { fill: #ff6a3d }
    .glow { stop-color: #ff6a3d }
    @media (prefers-color-scheme: light) {
      .dot { fill: #e04e1a }
      .glow { stop-color: #e04e1a }
    }
  </style>
  <defs>
    <radialGradient id="g" cx="16" cy="16" r="16" gradientUnits="userSpaceOnUse">
      <stop class="glow" offset="0.55" stop-opacity="0.55" />
      <stop class="glow" offset="1" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#g)" />
  <circle class="dot" cx="16" cy="16" r="10" />
</svg>
